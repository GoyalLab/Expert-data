# I/O
datasheet: 'resources/datasets/meta/training.csv'
output_dir: '/projects/b1042/GoyalLab/lschwartz/dl/data/merge'
cache_dir: '/projects/b1042/GoyalLab/lschwartz/dl/perturb-seq/data'

# Set a slightly higher number of control cells to get more robust efficiency scores
n_ctrl: 10000
min_cells_per_perturbation: 50                # Filter perturbations for a minimum number of cells WITHIN a dataset
min_cells_per_class: 10                    # Minimum number of cells per class (perturbation) ACROSS datasets
merge_method: 'concat_on_disk'

# Slurm config
resources:
  memory:
    min_mem: 50                 # Minimum RAM (GB)
    default: 200
    max_mem: 220                # Maximum RAM (GB) of default partition, switch to hi-mem beyond that

  partitions:
    default: 'genomics'
    high_mem: 'genomics-himem'
    gpu: 'gengpu'
  
  jobs:
    meta_info:
      time: '48:00:00'
      mem: '125GB'
    filter_cells_by_efficiency:
      time: '48:00:00'
      threads: 1
    merge_datasets:
      time: '48:00:00'
      mem: '50GB'
