# ExPert canonical-store pipeline -- default parameters.
#
# The pre-refactor pipeline uses config/defaults.legacy.yaml with
# `snakemake -s workflow/legacy/Snakefile`.
#
# Two hashes derive from these (src/workflow_utils.py):
#   DATASET_PARAM_KEYS -> DATASET_HASH, keys the canonical store
#   RECIPE_PARAM_KEYS  -> RECIPE_HASH,  keys the materialised DB
# Both are explicit ALLOW-LISTS, so a key added here does not silently invalidate
# existing artifacts.  Changing a key that IS listed does, by design.

## I/O
datasheet: 'resources/datasets/meta/training.csv'
output_dir: 'results'
cache_dir: 'data_cache'
store_dir: ''                    # defaults to <cache_dir>/store
log_dir: 'logs'
vocab_version: 'v1'              # resources/vocab/genes_<version>.tsv (append-only)

## Labels                                                    [DATASET + RECIPE hash]
perturbation_col: 'perturbation'
ctrl_key: 'control'

## Per-dataset canonicalisation                              [DATASET hash]
qc: true                         # MAD outlier + mito filter; thresholds are computed
n_ctrl: 10000                    # sampled cap; the chosen barcodes are STORED
single_perturbations_only: true
n_hvg: 3000                      # seurat_v3, per dataset

## Efficiency (Phase 3)
min_deg: 5                       # perturbations below this get no score (NaN)
n_pcs: 40                        # PCA fit on CONTROLS, everything else projected
n_eff_batches: 16

# --- perturbation pseudobulks ---------------------------------------------------
# In NEITHER hash's allow-list: a derived per-dataset artifact that no block and no
# materialised DB depends on, so these can change without invalidating anything.
pseudobulk_variants: [rep, meta, rep_eff]
n_rep: 2                   # random replicates per perturbation; >=2 to measure anything
min_cells_per_rep: 10      # below n_rep*this, emit one unsplit row instead
meta_k_max: 4              # ceiling on clustered meta-cells per perturbation
min_cells_per_meta: 20
meta_sep_threshold: 2.0    # k grows while kmeans BSS >= this x a random-split null                # fan-out width; fixed so the DAG is static

## Selection -> materialised DB                              [RECIPE hash]
var_merge: 'union'               # union | intersection of per-dataset top-n_hvg
min_cells_per_class: 20          # ACROSS datasets, for pool membership
min_dataset_frac: 0.6            # fraction of dataset GROUPS a perturbation must span
min_cells_per_perturbation: 20   # WITHIN a dataset, recounted after the pool filter
zs_min_cells_per_perturbation: 0 # zero-shot: 0 = no minimum
zs_eval_cap: 10                  # zero-shot: <=N cells per (dataset x perturbation)

## Materialisation
materialize_defer_compression: false  # measured 0.85x -- the uncompressed intermediate
                                      # costs more I/O than the gzip CPU it saves

## OOD benchmark folds
# Any `ood_<axis>` column in the datasheet declares a holdout axis; each distinct value
# becomes one fold.  `pair` lets donor folds also hold out a cell line.
benchmark_axes: [donor, cell_line, condition]
benchmark_pair: {donor: cell_line}
benchmark_max_ood_frac: 0.35
benchmark_eval_cap: 10           # val/test: <=N cells per (dataset x perturbation)
# Nested perturbation subsets of the DB for scaling benchmarks (the full DB is always
# produced).  Nested means 200 subset of 1000 subset of full, so differences across
# sizes reflect training volume rather than which perturbations were drawn.
benchmark_subset_sizes: [200]
test_frac: 0.1

## Other
cache: true
seed: 42

## Slurm config:
# Set RAM limits for all tasks that require loading datasets into memory
resources:
  time:
    short: '4:00:00'
    medium: '24:00:00'
    long: '48:00:00'
    default: '48:00:00'

  memory:
    min_mem: 20                 # Minimum RAM (GB)
    default: 100
    max_mem: 220                # Maximum RAM (GB) of default partition, tries to switch to high_mem if more is needed

  partitions:                   # Set your slurm partitions here
    default: 'normal'                 
    high_mem: ''
    gpu: ''

  jobs:
    build_vocab:
      time: '4:00:00'
      mem: '16GB'

    subset_db:
      time: '12:00:00'
      mem: '48GB'

    download_dataset:
      time: '12:00:00'
      mem: '20GB'

    # Canonical store (Phase 2).  Three streaming passes, O(chunk)+O(n_genes) memory,
    # so this does NOT scale with dataset size -- unlike process_dataset, which it
    # replaces and which requested up to 400GB from the hand-written datasheet column.
    canonicalize:
      time: '24:00:00'
      mem: '48GB'

    # Phase 3 efficiency.  E2 reads only the 3000 HVG columns and holds
    # (batch + n_ctrl) x n_hvg x 4 bytes, so it is small and flat -- unlike the rule it
    # replaces, whose peak was nnz_full*B + nnz_hvg*B (153 GiB on XAtlas2025_HEK293T).
    efficiency_fit:
      time: '8:00:00'
      mem: '32GB'
    efficiency_batch:
      time: '8:00:00'
      mem: '24GB'
    efficiency_gather:
      time: '2:00:00'
      mem: '16GB'

    # Phase 4.  build_recipe is pure metadata (seconds-to-minutes).  materialize is one
    # streaming pass; measured 5h59m / 22.5 GB peak for the 22-dataset, 103 GB DB, and
    # the gzip write is the bottleneck at ~4.8 MB/s.
    build_recipe:
      time: '4:00:00'
      mem: '32GB'
    materialize:
      time: '36:00:00'      # +zero-shot output: ~12.1M more cells to write
      mem: '48GB'
    gen_ood_splits:
      time: '8:00:00'
      mem: '64GB'

